<title>いっちゃんぬりえ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3A2E39;
    --panel:#FFFFFF;
    --shadow: 0 5px 0 rgba(58,46,57,0.12);
    --gap: 7px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    touch-action:manipulation;
    font-family:'M PLUS Rounded 1c', sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 10% 6%, #FFE7B0 0%, transparent 42%),
      radial-gradient(circle at 92% 10%, #C9F3FF 0%, transparent 38%),
      linear-gradient(160deg, #EAF6FF 0%, #FFF8EC 55%, #FFEAF2 100%);
  }

  #app{
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    gap:var(--gap);
    padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 8px);
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    height:34px;
  }
  .brand{display:flex; align-items:center; gap:6px;}
  .brand .mascot{
    font-size:24px;
    animation:sway 3.2s ease-in-out infinite;
  }
  @keyframes sway{0%,100%{transform:rotate(-7deg);}50%{transform:rotate(7deg);}}
  .brand h1{
    font-family:'Mochiy Pop One', sans-serif;
    font-size:17px; margin:0; color:#FF6B81; letter-spacing:1px;
    text-shadow:2px 2px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff;
  }
  .header-actions{display:flex; align-items:center; gap:6px;}
  #clearAllBtn{
    height:34px; padding:0 12px; border-radius:17px; border:none;
    background:#FFE3E3; box-shadow:0 3px 0 rgba(58,46,57,0.12);
    display:flex; align-items:center; justify-content:center;
  }
  #clearAllBtn svg{width:20px;height:20px;}
  #clearAllBtn:active{transform:translateY(3px); box-shadow:none;}
  #muteBtn{
    width:34px;height:34px;border-radius:50%;border:none;
    background:var(--panel); box-shadow:0 3px 0 rgba(58,46,57,0.12);
    display:flex;align-items:center;justify-content:center;
  }
  #muteBtn svg{width:18px;height:18px;}
  #muteBtn:active{transform:translateY(3px); box-shadow:none;}

  /* ---------- Picture chooser ---------- */
  .picture-tabs{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
  }
  .pic-tab{
    height:44px;
    border-radius:14px;
    border:3px solid transparent;
    background:var(--panel);
    box-shadow:0 4px 0 rgba(58,46,57,0.10);
    font-size:24px;
    display:flex;align-items:center;justify-content:center;
  }
  .pic-tab.active{
    border-color:#FFD93D; background:#FFF6D6;
    transform:translateY(2px); box-shadow:0 2px 0 rgba(58,46,57,0.10);
  }
  .pic-tab:active{transform:translateY(4px); box-shadow:none;}

  /* ---------- Canvas ---------- */
  .canvas-card{
    flex:1 1 auto;
    min-height:0;
    background:var(--panel);
    border-radius:24px;
    box-shadow:0 6px 0 rgba(58,46,57,0.10), 0 14px 24px rgba(58,46,57,0.10);
    padding:6px;
    display:flex; align-items:center; justify-content:center;
  }
  .canvas-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    background:#FFFDF7;
    border:5px solid #FFF1D6;
  }
  #svgPicture,#drawCanvas{position:absolute; top:0; left:0; width:100%; height:100%; display:block;}
  #drawCanvas{touch-action:none;}

  /* ---------- Palette ---------- */
  .color-grid{
    flex:0 0 auto;
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    background:var(--panel);
    border-radius:18px;
    box-shadow:var(--shadow);
    padding:8px;
    place-items:center;
  }
  .swatch{
    width:100%; aspect-ratio:1/1;
    max-width:44px; max-height:44px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,0.95);
    box-shadow:0 3px 0 rgba(58,46,57,0.18), inset 0 -3px 4px rgba(0,0,0,0.12), inset 0 3px 4px rgba(255,255,255,0.5);
    transition:transform .12s ease;
  }
  .swatch.selected{
    transform:scale(1.14);
    box-shadow:0 0 0 3px #fff, 0 0 0 6px #FF6B81;
  }
  .swatch:active{transform:scale(0.88);}

  /* ---------- Tools + actions ---------- */
  .bottom-bar{
    flex:0 0 auto;
    display:flex;
    gap:6px;
    align-items:stretch;
  }
  .tool-btn,.action-btn{
    flex:1 1 0;
    min-width:0;
    height:64px;
    border:none;
    border-radius:16px;
    background:#FFFFFF;
    box-shadow:var(--shadow);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    font-family:'M PLUS Rounded 1c',sans-serif;
    font-weight:800;
    font-size:10px;
    color:var(--ink);
    padding:4px 2px;
  }
  .tool-btn svg,.action-btn svg{width:32px;height:32px;}
  .tool-btn.active{
    background:linear-gradient(160deg,#FFE896,#FFC978);
    transform:translateY(2px);
    box-shadow:0 3px 0 rgba(58,46,57,0.18);
  }
  .tool-btn:active,.action-btn:active{transform:translateY(4px); box-shadow:none;}
  .divider{width:2px; background:rgba(58,46,57,0.10); border-radius:2px; margin:8px 2px;}
  #celebrateBtn{background:linear-gradient(160deg,#FFE896,#FFB86B);}

  /* ---------- Effects ---------- */
  #confettiLayer{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50;}
  .confetti-piece{position:absolute; top:-20px; border-radius:3px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(560deg); opacity:0.9;}}
  .sparkle{position:fixed; pointer-events:none; font-size:20px; z-index:60; animation:pop-away .6s ease-out forwards;}
  @keyframes pop-away{
    0%{transform:scale(0.4) translateY(0); opacity:1;}
    60%{transform:scale(1.2) translateY(-14px); opacity:1;}
    100%{transform:scale(0.8) translateY(-30px); opacity:0;}
  }
  @media (prefers-reduced-motion: reduce){
    .brand .mascot{animation:none;}
  }

  /* Roomier on tall / large screens */
  @media (min-height:760px){
    .pic-tab{height:54px; font-size:28px;}
    .tool-btn,.action-btn{height:74px; font-size:11px;}
    .tool-btn svg,.action-btn svg{width:38px;height:38px;}
    .swatch{max-width:52px; max-height:52px;}
    .brand h1{font-size:20px;}
    .brand .mascot{font-size:28px;}
  }
</style>
</head>

  function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
  function tone(freq,start,dur,type,peak){
    if(!actx || muted) return;
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0, actx.currentTime+start);
    g.gain.linearRampToValueAtTime(peak||0.11, actx.currentTime+start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+start+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime+start); o.stop(actx.currentTime+start+dur+0.02);
  }

    const a=s.a, tf = s.transform?` transform="${s.transform}"`:'';
    if(s.type==='rect') return `x="${a.x}" y="${a.y}" width="${a.width}" height="${a.height}"${a.rx?` rx="${a.rx}"`:''}${tf}`;

    if(s.type==='ellipse') return `cx="${a.cx}" cy="${a.cy}" rx="${a.rx}" ry="${a.ry}"${tf}`;
    return `d="${a.d}"${tf}`;
  }
  function renderPicture(id){

    // こうすると、あとに描かれる図形が前の図形の線（地平線など）を隠してくれる。
    regionsLayer.innerHTML = pic.shapes
      .map(s=>`<${TAG[s.type]} ${attrs(s)} data-region="${s.region}" fill="${fs[s.region]||'#FFFFFF'}" stroke="#3A2E39" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>`).join('');

  }

  function fitCanvas(){
    const pad = 12; // .canvas-card padding *2
    const w = canvasCard.clientWidth - pad;
    const h = canvasCard.clientHeight - pad;
    const size = Math.max(120, Math.floor(Math.min(w,h)));
    canvasWrap.style.width = size+'px';
    canvasWrap.style.height = size+'px';
  }

  });
  regionsLayer.addEventListener('click', e=>{
    if(currentTool!=='bucket') return;
    const t = e.target.closest('[data-region]'); if(!t) return;
    applyFill(t.getAttribute('data-region'), currentColor);
    playPop(); sparkle(e.clientX, e.clientY);
  });

  /* ============ drawing ============ */
  const SCALE = 2;
  const ERASER_SIZE = 34; // けしゴムの太さ（500x500 の座標系）

  // カンバスの下にある SVG の塗り領域を、画面座標から探す
  function regionAt(clientX, clientY){
    const els = document.elementsFromPoint(clientX, clientY);
    for(const el of els){
      if(el.getAttribute && el.getAttribute('data-region')) return el;
    }
    return null;
  }
  // タップしたところの色を白にもどす
  function eraseRegionAt(clientX, clientY){
    const el = regionAt(clientX, clientY);
    if(!el) return false;
    const region = el.getAttribute('data-region');
    if(!fillState[currentPictureId][region]) return false;
    delete fillState[currentPictureId][region];
    regionsLayer.querySelectorAll('[data-region="'+region+'"]').forEach(n=>n.setAttribute('fill','#FFFFFF'));
    return true;
  }

  canvas.width = 500*SCALE; canvas.height = 500*SCALE;
  ctx.setTransform(SCALE,0,0,SCALE,0,0);

  function pos(e){
    const r = canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)/r.width*500, y:(e.clientY-r.top)/r.height*500};
  }
  function seg(p1,p2,st){
    ctx.lineCap='round'; ctx.lineJoin='round';
    if(st.tool==='eraser'){
      ctx.globalCompositeOperation='destination-out';
      ctx.globalAlpha=1; ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineWidth=ERASER_SIZE;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
      ctx.globalCompositeOperation='source-over';
    } else if(st.tool==='pencil'){
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=0.95;
      ctx.strokeStyle=st.color; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
    } else {
      for(let i=0;i<3;i++){
        const j=()=>(Math.random()-0.5)*3;
        ctx.globalCompositeOperation='multiply'; ctx.globalAlpha=0.30;
        ctx.strokeStyle=st.color; ctx.lineWidth=15+Math.random()*5;
        ctx.beginPath(); ctx.moveTo(p1.x+j(),p1.y+j()); ctx.lineTo(p2.x+j(),p2.y+j()); ctx.stroke();
      }
      ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    }
  }
  function redrawStrokes(id){
    ctx.clearRect(0,0,500,500);
    strokeState[id].forEach(st=>{
      const p=st.points;
      if(p.length===1) seg(p[0],p[0],st);
      for(let i=1;i<p.length;i++) seg(p[i-1],p[i],st);
    });
  }
  canvas.addEventListener('pointerdown', e=>{
    if(currentTool==='bucket') return;
    isDrawing=true;
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    const p=pos(e);
    currentStroke={tool:currentTool,color:currentColor,points:[p]};
    strokeState[currentPictureId].push(currentStroke);
    seg(p,p,currentStroke);
    if(currentTool==='eraser'){ eraseRegionAt(e.clientX, e.clientY); }
    playPop();
  });
  canvas.addEventListener('pointermove', e=>{
    if(!isDrawing||!currentStroke) return;
    const p=pos(e), last=currentStroke.points[currentStroke.points.length-1];
    currentStroke.points.push(p); seg(last,p,currentStroke);
  });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    canvas.addEventListener(ev, ()=>{isDrawing=false; currentStroke=null;}));

  /* ============ actions ============ */
  document.getElementById('clearAllBtn').addEventListener('click', ()=>{
    fillState[currentPictureId]={}; strokeState[currentPictureId]=[];
    renderPicture(currentPictureId); playSwitch();
  });
  document.getElementById('celebrateBtn').addEventListener('click', ()=>{ playCelebrate(); confetti(); });

  const muteBtn=document.getElementById('muteBtn'), waves=document.getElementById('soundWaves');
  muteBtn.addEventListener('click', ()=>{
    muted=!muted;
    waves.style.display = muted?'none':'';
    muteBtn.style.opacity = muted?'0.45':'1';
    if(!muted) ensureAudio();
  });

  /* ============ effects ============ */
  function sparkle(x,y){
    const el=document.createElement('div');
    el.className='sparkle';
    el.textContent=['✨','⭐','💫'][Math.floor(Math.random()*3)];
    el.style.left=(x-10)+'px'; el.style.top=(y-10)+'px';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),650);
  }
  function confetti(){
    const layer=document.getElementById('confettiLayer');
    for(let i=0;i<60;i++){
      const p=document.createElement('div');
      p.className='confetti-piece';
      const s=6+Math.random()*8, d=2.2+Math.random()*1.6;
      p.style.width=s+'px'; p.style.height=(s*0.6)+'px';
      p.style.left=Math.random()*100+'vw';
      p.style.background=COLORS[Math.floor(Math.random()*COLORS.length)];
      p.style.animationDuration=d+'s';
      p.style.animationDelay=(Math.random()*0.4)+'s';
      layer.appendChild(p);
      setTimeout(()=>p.remove(),(d+0.6)*1000);
    }
  }

  /* ============ ホーム画面に追加したときの設定 ============ */
  (function setupManifest(){
    try{
      const icon = document.getElementById('appIcon').href;
      const manifest = {
        name:"いっちゃんぬりえ",
        short_name:"いっちゃんぬりえ",
        lang:"ja",
        start_url:".",
        display:"standalone",
        orientation:"portrait",
        background_color:"#FFEAF2",
        theme_color:"#FF7BA3",
        icons:[
          {src:icon, sizes:"512x512", type:"image/png", purpose:"any"},
          {src:icon, sizes:"512x512", type:"image/png", purpose:"maskable"}
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
      document.getElementById('manifestLink').href = URL.createObjectURL(blob);
    }catch(e){}
  })();

  /* ============ init ============ */
  if(window.ResizeObserver){ new ResizeObserver(fitCanvas).observe(canvasCard); }
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', ()=>setTimeout(fitCanvas,200));

  renderColors();
  setTool('bucket');
  renderPicture('bear');
  fitCanvas();

})();
</script>
</body>
</html>
